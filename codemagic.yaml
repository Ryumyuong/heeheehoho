# Codemagic CI — Mac 없이 iOS 빌드/배포용 설정.
#
# 준비물(Codemagic 웹에서 한 번만):
#  1) 이 GitHub 저장소 연결
#  2) Teams → Integrations → App Store Connect 에 API 키 등록(이름: 아래 auth 참조)
#  3) Environment variables 그룹 `heeheehoho_secrets` 에 KMA_API_KEY 추가(Secure 체크)
#     - 값은 로컬 env.json 의 KMA_API_KEY 와 동일(공공데이터포털 "디코딩된" 키)
#  4) App Store Connect 에 번들 ID `com.heeheehoho.app` 앱 생성
workflows:
  ios-release:
    name: heeheehoho iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # 태그를 붙여 푸시할 때만 빌드한다. 커밋마다 돌리면 맥 인스턴스 시간을
    # 금방 쓰고, 아직 확인 안 끝난 변경이 테스터에게 나가버린다.
    #
    #   git tag v1.0.16
    #   git push origin v1.0.16
    #
    # 주의: YAML만으로는 안 되고, Codemagic 웹 → 앱 설정 → Webhooks 에서
    # GitHub 웹훅을 한 번 등록해야 실제로 트리거된다.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    integrations:
      # Codemagic → Teams → Integrations → App Store Connect 에 등록한
      # **API 키 이름**과 정확히 같아야 한다(아래는 예시 이름).
      app_store_connect: heeheehoho_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.heeheehoho.app"
      groups:
        # KMA_API_KEY 가 들어 있는 환경변수 그룹
        - heeheehoho_secrets
      # `ios_signing:` 자동 서명은 쓰지 않는다. 프로파일을 못 만들면 스크립트가
      # 돌기 전 준비 단계에서 "No matching profiles found" 로 죽어 로그가 없다.
      # 아래 서명 단계에서 개인키부터 직접 만들어 인증서·프로파일까지 생성한다.
    scripts:
      - name: Flutter 설정(SPM 마이그레이션 끄기)
        script: |
          # 켜져 있으면 `flutter build ipa` 도중에 Swift Package Manager 통합을
          # 붙이며 project.pbxproj 를 다시 쓴다. 그 과정에서 바로 앞 단계의
          # 수동 서명 설정이 날아가 "No valid code signing certificates" 로 죽는다.
          flutter config --no-enable-swift-package-manager

      - name: Flutter 패키지 설치
        script: flutter pub get

      - name: CocoaPods 설치
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: 빌드 번호를 TestFlight 최신 +1 로
        script: |
          # 같은 빌드 번호는 업로드가 거부되므로 자동 증가시킨다.
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" --increment 2>/dev/null || echo "1")
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "FLUTTER_BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: 서명 인증서·프로파일 준비(없으면 생성)
        script: |
          set -e
          keychain initialize

          # 배포 인증서를 만들려면 그 인증서의 **개인키**가 있어야 한다.
          # 키를 빌드마다 새로 만들면 그때마다 새 배포 인증서를 발급하려 하고,
          # Apple 한도가 2개라 곧 409(You already have a current Distribution
          # certificate)로 죽는다. 그래서 키는 반드시 환경변수로 고정한다.
          #
          # 등록 위치: Codemagic → 앱 → Environment variables
          #   이름  CERTIFICATE_PRIVATE_KEY
          #   그룹  heeheehoho_secrets   ← 이 그룹이어야 워크플로가 가져온다
          #   Secure 체크
          # PEM 을 그대로 환경변수에 넣으면 줄바꿈이 깨져 "is not valid" 로 죽는다.
          # 그래서 base64 로 넣은 CERTIFICATE_PRIVATE_KEY_B64 를 우선 쓴다.
          if [ -n "$CERTIFICATE_PRIVATE_KEY_B64" ]; then
            echo "개인키: CERTIFICATE_PRIVATE_KEY_B64 (base64) 사용"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" | base64 -d > /tmp/cert_key.pem
          elif [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "개인키: CERTIFICATE_PRIVATE_KEY (PEM 원문) 사용"
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          else
            echo "=============================================================="
            echo "!! 개인키 환경변수가 비어 있다."
            echo "   Codemagic → Environment variables 에"
            echo "     이름  CERTIFICATE_PRIVATE_KEY_B64"
            echo "     값    keys/heeheehoho_cert_key.b64 파일 내용(한 줄)"
            echo "     그룹  heeheehoho_secrets   ← 이 그룹이어야 주입된다"
            echo "   Secure 체크 후 저장할 것."
            echo "=============================================================="
            exit 1
          fi
          echo "── 받은 개인키 ──"
          echo "  줄 수: $(wc -l < /tmp/cert_key.pem)"
          openssl rsa -in /tmp/cert_key.pem -check -noout \
            || { echo "!! 개인키 형식이 깨졌다(붙여넣기 확인)"; exit 1; }
          echo -n "  공개키 지문: "
          openssl rsa -in /tmp/cert_key.pem -pubout 2>/dev/null | openssl sha256
          CERT_KEY="@file:/tmp/cert_key.pem"

          # --create: 배포 인증서·번들 ID·프로비저닝 프로파일이 없으면 만든다.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$CERT_KEY"

          keychain add-certificates
          xcode-project use-profiles
          # 아래는 실패했을 때 원인을 바로 보기 위한 확인용 출력.
          echo "── 키체인의 서명 인증서 ──"
          security find-identity -v -p codesigning || true
          echo "── 내려받은 프로비저닝 프로파일 ──"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          echo "── export_options.plist ──"
          cat /Users/builder/export_options.plist || true

      - name: iOS 빌드(IPA)
        script: |
          flutter build ipa --release \
            --dart-define=KMA_API_KEY="$KMA_API_KEY" \
            --build-number="${FLUTTER_BUILD_NUMBER:-1}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        # Codemagic 에 등록한 App Store Connect 통합을 사용
        auth: integration
        # 빌드 후 TestFlight 내부 테스터에게 자동 배포
        submit_to_testflight: true
      email:
        recipients:
          - ehsrkdl96@gmail.com
        notify:
          success: true
          failure: true
